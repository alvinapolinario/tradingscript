<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pullback Desk · Vantage</title>
  <link rel="stylesheet" href="/static/shell.css" />
  <style>
    :root {
      --bg: #0b1210;
      --panel: #121c19;
      --line: #2a3d36;
      --text: #e8f2ed;
      --muted: #8aa399;
      --buy: #3dd68c;
      --sell: #f07575;
      --warn: #e8c547;
      --accent: #5ee0b5;
      --mono: "Cascadia Code", "Consolas", ui-monospace, monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(700px 320px at 10% 0%, #1a2830 0%, transparent 55%),
        var(--bg);
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; flex-wrap: wrap;
      padding: .85rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: rgba(11,18,16,.92);
      position: sticky; top: 0; z-index: 5;
    }
    header h1 { margin: 0; font-size: 1.05rem; }
    header .sub { color: var(--muted); font-size: .78rem; margin-top: .15rem; }
    .actions { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; }
    .pill {
      display: inline-flex; align-items: center; gap: .35rem;
      border: 1px solid var(--line); border-radius: 999px;
      padding: .35rem .7rem; font-size: .78rem; background: var(--panel);
    }
    .pair-select {
      display: inline-flex; align-items: center; gap: .45rem;
      border: 1px solid var(--line); border-radius: 999px;
      padding: .3rem .55rem .3rem .65rem;
      background: var(--panel);
      font-size: .78rem;
    }
    .pair-select label {
      color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
    }
    .pair-select select {
      appearance: none;
      border: 0; background: transparent; color: var(--text);
      font-family: var(--mono); font-size: .85rem; font-weight: 650;
      padding: .15rem .35rem; min-width: 6.5rem; cursor: pointer;
    }
    .pair-select select:focus { outline: none; }
    .pair-select .pair-dot {
      width: .45rem; height: .45rem; border-radius: 50%; background: var(--muted); flex-shrink: 0;
    }
    .pair-select .pair-dot.ok { background: var(--buy); }
    .pair-select .pair-dot.warn { background: var(--warn); }
    main { max-width: 960px; margin: 0 auto; padding: 1rem 1.1rem 2.5rem; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .55rem;
      margin-bottom: .75rem;
    }
    .kpi-grid.scores {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 1.1rem;
    }
    .kpi {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .7rem .8rem;
      min-width: 0;
    }
    .kpi .k {
      font-size: .65rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    }
    .kpi .v {
      font-family: var(--mono); font-size: 1.35rem; font-weight: 750; margin-top: .2rem;
    }
    .kpi .s { font-size: .72rem; color: var(--muted); margin-top: .15rem; }
    .kpi.pb .v { color: var(--accent); }
    .kpi.cont .v { color: var(--buy); }
    .kpi.cons .v { color: var(--warn); }
    .kpi.rev .v { color: var(--sell); }
    .kpi.hot .v { color: var(--warn); }
    .v2-banner {
      border: 1px solid #3a5a4a;
      background: rgba(94, 224, 181, 0.08);
      border-radius: 12px;
      padding: .55rem .75rem;
      font-size: .75rem;
      color: var(--accent);
      margin-bottom: .75rem;
    }
    .kpi.v2 .v { color: var(--accent); }
    .section-title {
      font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin: .2rem 0 .55rem;
    }
    .empty {
      border: 1px dashed var(--line); border-radius: 14px;
      padding: 1.5rem; color: var(--muted); text-align: center; line-height: 1.5;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      margin-bottom: .85rem;
    }
    .state {
      font-size: 1.15rem; font-weight: 800; letter-spacing: .02em; color: var(--accent);
    }
    .meta { color: var(--muted); font-size: .78rem; margin-top: .35rem; line-height: 1.45; }
    .grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: .55rem;
    }
    .col .k {
      font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    }
    .col .v {
      font-family: var(--mono); font-size: .9rem; font-weight: 650; margin-top: .15rem;
    }
    .checks {
      list-style: none; margin: 0; padding: 0;
      display: flex; flex-direction: column; gap: .35rem;
    }
    .checks li {
      background: rgba(0,0,0,.22);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .45rem .65rem;
      font-size: .86rem;
    }
    .checks li.pos { color: var(--buy); }
    .checks li.neg { color: var(--sell); }
    @media (max-width: 800px) {
      .kpi-grid, .kpi-grid.scores { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr 1fr; }
      .pair-select { width: 100%; }
      .pair-select select { flex: 1; min-width: 0; }
    }
  </style>
</head>
<body data-nav="pullback">
  <header>
    <div>
      <h1>Pullback Probability Desk</h1>
      <div class="sub">H1 / M15 / M5 scored on the EA · advisory only · never places orders</div>
    </div>
    <div class="actions">
      <div class="pair-select" title="Select chart pair — same as Market Overview">
        <span class="pair-dot" id="pairDot"></span>
        <label for="symbolSelect">Symbol</label>
        <select id="symbolSelect" aria-label="Pullback symbol"></select>
      </div>
      <span class="pill" id="trendPill">—</span>
    </div>
  </header>
  <main>
    <div id="kpis"></div>
    <div id="body"><div class="empty">Loading…</div></div>
  </main>
  <script>
    let selectingSymbol = false;

    function fmtPx(n, digits) {
      if (n == null || Number.isNaN(Number(n)) || Number(n) === 0) return "—";
      const d = digits != null ? digits : (Number(n) >= 100 ? 2 : 5);
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function fmtPct(n) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      return Number(n).toFixed(0) + "%";
    }
    function fmtScore(n) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      return Number(n).toFixed(0) + "/100";
    }
    function splitReasons(s) {
      if (!s) return [];
      return String(s).split(";").map((x) => x.trim()).filter(Boolean);
    }
    function syncSymbolSelect(payload) {
      const sel = document.getElementById("symbolSelect");
      if (!sel || selectingSymbol) return;
      const current = payload.selected_symbol || payload.symbol || "";
      const names = (payload.available_symbols && payload.available_symbols.length)
        ? payload.available_symbols.slice()
        : (payload.symbols || []).map((x) => x.symbol || x).filter(Boolean);
      if (!names.length && current) names.push(current);
      const key = names.join("|");
      if (sel.dataset.key !== key) {
        sel.dataset.key = key;
        sel.innerHTML = names.map(
          (s) => `<option value="${s}" ${s === current ? "selected" : ""}>${s}</option>`
        ).join("");
      } else if (current && sel.value !== current) {
        sel.value = current;
      }
      const byName = Object.fromEntries(
        (payload.symbols || []).map((x) => [x.symbol, x])
      );
      const meta = byName[current] || {};
      const online = !!(meta.connected || (payload.ea_online && (payload.symbol || "") === current));
      const dot = document.getElementById("pairDot");
      dot.className = "pair-dot " + (online ? "ok" : "warn");
      sel.title = online
        ? "EA online for this pair"
        : "Waiting for EA heartbeat on this pair";
    }
    function render(payload) {
      const body = document.getElementById("body");
      const kpis = document.getElementById("kpis");
      const pb = payload.pullback;
      syncSymbolSelect(payload);

      if (!payload.ea_online) {
        kpis.innerHTML = "";
        document.getElementById("trendPill").textContent = "offline";
        body.innerHTML = `<div class="empty">EA offline on <b>${payload.selected_symbol || payload.symbol || "this pair"}</b>.<br/>Attach the Vantage EA to that chart, or pick another symbol above.</div>`;
        return;
      }
      if (!payload.pullback_supported || !pb) {
        kpis.innerHTML = "";
        document.getElementById("trendPill").textContent = "unsupported";
        body.innerHTML = `<div class="empty">This EA build is not sending <b>pullback</b> yet for <b>${payload.selected_symbol || "—"}</b>.<br/>
          In MetaEditor: recompile <b>VantageMT5AIDecisionAssistant.mq5</b> (needs <b>VantagePullback.mqh</b>), reload on the chart, wait for a new M5 close / heartbeat (~15s).</div>`;
        return;
      }
      if (pb.valid === false) {
        kpis.innerHTML = "";
        document.getElementById("trendPill").textContent = "warming up";
        body.innerHTML = `<div class="empty">Pullback analyzer warming up or insufficient data on <b>${payload.selected_symbol || "—"}</b>.<br/>Wait for closed H1/M15/M5 bars.</div>`;
        return;
      }

      const dig = payload.digits || 5;
      document.getElementById("trendPill").textContent = pb.dominant_trend || "—";
      kpis.innerHTML = `
        <div class="kpi-grid">
          <div class="kpi pb"><div class="k">Pullback</div><div class="v">${fmtPct(pb.pullback_probability)}</div><div class="s">mean-reversion odds</div></div>
          <div class="kpi cont"><div class="k">Continuation</div><div class="v">${fmtPct(pb.continuation_probability)}</div><div class="s">trend resume</div></div>
          <div class="kpi cons"><div class="k">Consolidation</div><div class="v">${fmtPct(pb.consolidation_probability)}</div><div class="s">range / chop</div></div>
          <div class="kpi rev"><div class="k">Reversal</div><div class="v">${fmtPct(pb.reversal_probability)}</div><div class="s">capped without HTF break</div></div>
        </div>
        <div class="kpi-grid scores">
          <div class="kpi hot"><div class="k">Extension</div><div class="v">${fmtPct(pb.extension_score)}</div><div class="s">do-not-chase pressure</div></div>
          <div class="kpi"><div class="k">Pullback quality</div><div class="v">${fmtPct(pb.pullback_quality)}</div><div class="s">structure + S/R room</div></div>
          <div class="kpi"><div class="k">Trend strength</div><div class="v">${fmtPct(pb.trend_strength)}</div><div class="s">H1-weighted bias</div></div>
        </div>`;

      const pos = splitReasons(pb.reasons_positive).map((r) => `<li class="pos">${r}</li>`).join("");
      const neg = splitReasons(pb.reasons_negative).map((r) => `<li class="neg">${r}</li>`).join("");
      const v2 = payload.pullback_v2;
      let v2Html = "";
      if (payload.pullback_v2_supported && v2 && v2.valid !== false) {
        const ms = v2.market_structure || {};
        const hz = v2.prediction_horizon || {};
        const ev = v2.pullback_event_definition || {};
        const dr = v2.dealing_range || {};
        const mom = v2.momentum || {};
        const liq = v2.liquidity || {};
        const poi = v2.poi || {};
        const ote = v2.ote || {};
        const depth = v2.depth || {};
        const pos2 = splitReasons(v2.reasons_positive).map((r) => `<li class="pos">${r}</li>`).join("");
        const neg2 = splitReasons(v2.reasons_negative).map((r) => `<li class="neg">${r}</li>`).join("");
        v2Html = `
        <div class="v2-banner">Pullback Desk V2 Milestone 7 — Raw scores on chart; calibration buckets computed offline from CSV + labeled outcomes.</div>
        <div class="section-title">Pullback Desk V2 · independent scores</div>
        <div class="kpi-grid">
          <div class="kpi v2"><div class="k">Pullback score</div><div class="v">${fmtScore(v2.pullback_score)}</div><div class="s">independent</div></div>
          <div class="kpi cont"><div class="k">Immediate continuation</div><div class="v">${fmtScore(v2.immediate_continuation_score)}</div><div class="s">without pullback</div></div>
          <div class="kpi"><div class="k">Continuation after PB</div><div class="v">${fmtScore(v2.continuation_after_pullback_score)}</div><div class="s">if pullback occurs</div></div>
          <div class="kpi rev"><div class="k">Reversal risk</div><div class="v">${fmtScore(v2.reversal_risk_score)}</div><div class="s">structural</div></div>
        </div>
        <div class="kpi-grid scores">
          <div class="kpi hot"><div class="k">Extension</div><div class="v">${fmtScore(v2.extension_score)}</div><div class="s">market stretch</div></div>
          <div class="kpi"><div class="k">Displacement</div><div class="v">${fmtScore(v2.displacement_score)}</div><div class="s">impulse quality</div></div>
          <div class="kpi"><div class="k">Entry location</div><div class="v">${fmtScore(v2.entry_location_score)}</div><div class="s">trend-entry quality</div></div>
        </div>
        <div class="kpi-grid scores">
          <div class="kpi"><div class="k">Premium / Discount</div><div class="v">${dr.location || v2.premium_discount_location || "—"}</div><div class="s">${dr.position_pct != null ? Number(dr.position_pct).toFixed(0) + "% of range" : "—"}</div></div>
          <div class="kpi"><div class="k">Momentum</div><div class="v">${mom.state || v2.momentum_state || "—"}</div><div class="s">RSI ${mom.rsi_level != null ? Number(mom.rsi_level).toFixed(1) : (v2.rsi_level != null ? Number(v2.rsi_level).toFixed(1) : "—")}</div></div>
        </div>
        <div class="kpi-grid scores">
          <div class="kpi"><div class="k">Liquidity draw</div><div class="v">${liq.draw || v2.liquidity_draw || "—"}</div><div class="s">${liq.state || v2.liquidity_state || "—"}</div></div>
          <div class="kpi"><div class="k">Liquidity distance</div><div class="v">${liq.distance_atr != null ? Number(liq.distance_atr).toFixed(2) + " ATR" : (v2.liquidity_distance_atr != null ? Number(v2.liquidity_distance_atr).toFixed(2) + " ATR" : "—")}</div><div class="s">${liq.from_liquidity_grab ? "Liquidity Grab module" : "Structural fallback"}</div></div>
          <div class="kpi"><div class="k">Expected depth</div><div class="v">${v2.expected_depth || "—"}</div><div class="s">${v2.expected_pullback_atr != null ? Number(v2.expected_pullback_atr).toFixed(2) + " ATR est." : "—"}</div></div>
        </div>
        <div class="kpi-grid scores">
          <div class="kpi"><div class="k">Primary POI</div><div class="v">${poi.primary_type || v2.poi_primary_type || "—"}</div><div class="s">${poi.primary_dir || "—"} · ${poi.status || "—"}</div></div>
          <div class="kpi"><div class="k">POI quality</div><div class="v">${poi.quality != null ? Number(poi.quality).toFixed(0) : "—"}</div><div class="s">Target ${poi.pullback_target_score != null ? Number(poi.pullback_target_score).toFixed(0) : (v2.poi_pullback_target_score != null ? Number(v2.poi_pullback_target_score).toFixed(0) : "—")}/100</div></div>
          <div class="kpi"><div class="k">POI distance</div><div class="v">${poi.distance_atr != null ? Number(poi.distance_atr).toFixed(2) + " ATR" : "—"}</div><div class="s">${poi.price_inside ? "Inside zone" : (poi.price_approaching ? "Approaching" : (poi.from_gold_smc ? "Gold SMC" : "M15 fallback"))}</div></div>
        </div>
        <div class="kpi-grid scores">
          <div class="kpi"><div class="k">OTE zone</div><div class="v">${ote.valid ? (ote.price_in_ote ? "IN OTE" : "Outside") : "—"}</div><div class="s">${ote.poi_overlaps_ote ? "POI overlap" : (ote.from_gold_smc ? "Gold SMC" : "M15 fallback")}</div></div>
          <div class="kpi"><div class="k">Depth target</div><div class="v">${depth.expected_depth || v2.expected_depth || "—"}</div><div class="s">${depth.expected_pullback_atr != null ? Number(depth.expected_pullback_atr).toFixed(2) + " ATR" : (v2.expected_pullback_atr != null ? Number(v2.expected_pullback_atr).toFixed(2) + " ATR" : "—")}</div></div>
          <div class="kpi"><div class="k">Cont. after PB</div><div class="v">${fmtScore(v2.continuation_after_pullback_score)}</div><div class="s">${depth.source || v2.depth_source || "—"} · fib ${depth.fib_retrace_pct != null ? Number(depth.fib_retrace_pct).toFixed(0) + "%" : "—"}</div></div>
        </div>
        <div class="card">
          <div class="state">${v2.market_state || "—"}</div>
          <div class="meta">${v2.explanation || v2.short_reason || "—"}</div>
          <div class="meta">Horizon: ${hz.bars || "—"} ${hz.timeframe || "M15"} bars (~${hz.minutes || "—"} min) · Event: ≥ ${ev.threshold_atr != null ? Number(ev.threshold_atr).toFixed(2) : "—"} ATR retracement</div>
          <div class="meta">Structure H1/M15/M5: ${ms.h1 || "—"} / ${ms.m15 || "—"} / ${ms.m5 || "—"} · BOS ${ms.bullish_bos ? "bull" : ""}${ms.bearish_bos ? "bear" : ""}${!ms.bullish_bos && !ms.bearish_bos ? "none" : ""} · CHoCH ${ms.bullish_choch || ms.bearish_choch ? "yes" : "none"} · MSS ${ms.bullish_mss || ms.bearish_mss ? "yes" : "none"}</div>
          ${dr.low != null && dr.high != null ? `<div class="meta">Dealing range: ${fmtPx(dr.low, dig)} – ${fmtPx(dr.high, dig)}</div>` : ""}
          ${liq.target_price != null && liq.target_price > 0 ? `<div class="meta">Liquidity target: ${fmtPx(liq.target_price, dig)} (${liq.target_label || "—"})</div>` : ""}
          ${poi.lower != null && poi.upper != null && poi.upper > poi.lower ? `<div class="meta">POI zone: ${fmtPx(poi.lower, dig)} – ${fmtPx(poi.upper, dig)} · FVG ${poi.fvg_count != null ? poi.fvg_count : 0} · OB ${poi.ob_count != null ? poi.ob_count : 0}</div>` : ""}
          ${ote.ote_low != null && ote.ote_high != null && ote.ote_high > ote.ote_low ? `<div class="meta">OTE zone: ${fmtPx(ote.ote_low, dig)} – ${fmtPx(ote.ote_high, dig)} · mid ${fmtPx(ote.ote_mid, dig)}</div>` : ""}
          ${depth.target_mid != null && depth.target_mid > 0 ? `<div class="meta">Depth target mid: ${fmtPx(depth.target_mid, dig)} (${depth.source || "—"})</div>` : ""}
        </div>
        <div class="section-title">V2 factor checklist</div>
        <div class="card"><ul class="checks">${pos2 || "<li class='pos'>No positive factors listed</li>"}${neg2}</ul></div>
        <div id="shadowBox"></div>`;
      } else if (payload.ea_online && payload.pullback_supported) {
        v2Html = `<div class="card"><div class="meta">Pullback Desk V2 not available yet for this EA build. Recompile with <b>VantagePullbackV2.mqh</b> and enable <b>InpPullbackV2Enable</b>.</div></div>`;
      }
      body.innerHTML = `
        <div class="section-title">Market state · ${payload.selected_symbol || payload.symbol || "—"}</div>
        <div class="card">
          <div class="state">${pb.market_state || "—"}</div>
          <div class="meta">${pb.explanation || pb.short_reason || "—"}</div>
          ${pb.session ? `<div class="meta">Session: ${pb.session}</div>` : ""}
        </div>
        <div class="section-title">Levels</div>
        <div class="card">
          <div class="grid">
            <div class="col"><div class="k">Support</div><div class="v">${fmtPx(pb.nearest_support, dig)}</div></div>
            <div class="col"><div class="k">Resistance</div><div class="v">${fmtPx(pb.nearest_resistance, dig)}</div></div>
            <div class="col"><div class="k">Target band</div><div class="v">${fmtPx(pb.pullback_target_low, dig)} – ${fmtPx(pb.pullback_target_high, dig)}</div></div>
            <div class="col"><div class="k">Invalidation</div><div class="v">${fmtPx(pb.invalidation, dig)}</div></div>
          </div>
        </div>
        <div class="section-title">Factor checklist</div>
        <div class="card">
          <ul class="checks">${pos || "<li class='pos'>No positive factors listed</li>"}${neg}</ul>
        </div>
        <p class="meta" style="text-align:center">Advisory only — never places, modifies, or cancels MT5 orders. Bid ${fmtPx(payload.bid, dig)} / Ask ${fmtPx(payload.ask, dig)}</p>
        ${v2Html}`;
    }
    async function loadShadow() {
      const box = document.getElementById("shadowBox");
      if (!box) return;
      try {
        const r = await fetch("/api/v1/pullback/v2/shadow");
        const s = await r.json();
        if (!s.available) {
          box.innerHTML = `<div class="card"><div class="meta">V1/V2 shadow compare unavailable — need both heartbeat blobs.</div></div>`;
          return;
        }
        const gaps = (s.gap_notes || []).map((n) => `<li class="neg">${n}</li>`).join("");
        box.innerHTML = `
        <div class="section-title">V1 vs V2 shadow (live)</div>
        <div class="kpi-grid scores">
          <div class="kpi"><div class="k">V1 dominant</div><div class="v">${s.v1_dominant_outcome || "—"}</div><div class="s">PB ${s.v1_probs?.pullback ?? "—"}%</div></div>
          <div class="kpi"><div class="k">V2 posture</div><div class="v">${s.v2_posture || "—"}</div><div class="s">PB score ${s.v2_scores?.pullback ?? "—"}</div></div>
          <div class="kpi"><div class="k">Alignment</div><div class="v">${s.aligned ? "ALIGNED" : "GAP"}</div><div class="s">CSV ${s.csv_logging_enabled ? "on" : "off"}</div></div>
        </div>
        ${gaps ? `<div class="card"><ul class="checks">${gaps}</ul></div>` : ""}
        <div class="card"><div class="meta">Offline: POST /api/v1/pullback/v2/label · POST /api/v1/pullback/v2/calibrate · POST /api/v1/pullback/v2/shadow/analyze (add <code>include_calibration: true</code> for bucket thresholds).</div></div>`;
      } catch (e) {
        box.innerHTML = "";
      }
    }
    async function refresh() {
      try {
        const r = await fetch("/api/v1/pullback/status");
        const j = await r.json();
        render(j);
        await loadShadow();
      } catch (e) {
        document.getElementById("body").innerHTML =
          `<div class="empty">Failed to load pullback status</div>`;
      }
    }
    document.getElementById("symbolSelect").addEventListener("change", async () => {
      const sym = document.getElementById("symbolSelect").value;
      if (!sym || selectingSymbol) return;
      selectingSymbol = true;
      try {
        await fetch("/api/v1/monitor/select-symbol", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol: sym }),
        });
      } catch (_) {}
      selectingSymbol = false;
      await refresh();
    });
    refresh();
    setInterval(refresh, 11000);
  </script>
  <script src="/static/shell.js"></script>
</body>
</html>
