<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Execution · Vantage</title>
  <link rel="stylesheet" href="/static/shell.css" />
  <style>
    :root {
      --bg: #0a0e14; --panel: #121824; --line: #263044; --text: #e8eef8;
      --muted: #8a96aa; --accent: #ffb347; --good: #3dd68c; --warn: #e8c547;
      --bad: #f07178; --mono: "Cascadia Code", Consolas, ui-monospace, monospace;
    }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }
    header { padding: .9rem 1.25rem; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 1.05rem; }
    .banner { background: rgba(255,179,71,.12); border: 1px solid rgba(255,179,71,.35); color: #ffd89a; padding: .55rem .85rem; border-radius: 10px; font-size: .78rem; margin-top: .55rem; }
    .sub { color: var(--muted); font-size: .76rem; margin-top: .25rem; }
    main { max-width: 960px; margin: 0 auto; padding: 1rem 1rem 2.5rem; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6rem; margin-bottom: 1rem; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: .7rem .85rem; }
    .k { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .v { font-family: var(--mono); font-size: 1rem; font-weight: 700; margin-top: .2rem; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    th, td { padding: .55rem .7rem; text-align: left; border-bottom: 1px solid var(--line); font-size: .82rem; }
    th { color: var(--muted); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; }
    .pill { font-size: .68rem; font-weight: 700; padding: .2rem .5rem; border-radius: 999px; border: 1px solid var(--line); }
    .pill.FILLED { color: var(--good); border-color: rgba(61,214,140,.4); }
    .pill.PENDING { color: var(--warn); }
    .pill.REJECTED, .pill.SKIPPED, .pill.EXPIRED { color: var(--bad); }
    .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 1.5rem; color: var(--muted); text-align: center; }
    .mode-bar { display: flex; gap: .45rem; margin: .75rem 0 1rem; }
    .mode-bar button { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 999px; padding: .35rem .75rem; cursor: pointer; font-size: .78rem; }
    .mode-bar button.active { border-color: var(--accent); color: var(--accent); }
    @media (max-width: 820px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body data-nav="execution">
  <header>
    <h1>Demo Execution Journal</h1>
    <div class="sub">Swing or Scalping mode · VantageSwingExecutor EA · demo account only</div>
    <div class="banner">Demo execution — not financial advice. Validates fill mechanics only; does not guarantee live performance.</div>
  </header>
  <main>
    <div class="mode-bar">
      <button type="button" data-mode="" class="active">All</button>
      <button type="button" data-mode="SWING">Swing</button>
      <button type="button" data-mode="SCALPING">Scalping</button>
    </div>
    <div class="stats" id="stats"></div>
    <div id="table-wrap"><div class="empty">Loading…</div></div>
  </main>
  <script src="/static/shell.js"></script>
  <script>
    function fmt(n, d = 2) { return n == null || isNaN(Number(n)) ? "—" : Number(n).toFixed(d); }
    let filterMode = "";
    document.querySelectorAll(".mode-bar button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".mode-bar button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filterMode = btn.dataset.mode || "";
        tick();
      });
    });
    function render(data) {
      const s = data.summary || {};
      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="k">EA online</div><div class="v">${s.ea_online ? "YES" : "NO"}</div></div>
        <div class="stat"><div class="k">Engine mode</div><div class="v" style="font-size:.78rem">${s.blob_trade_mode || "—"}</div></div>
        <div class="stat"><div class="k">Current signal</div><div class="v" style="font-size:.78rem">${s.current_signal || "—"}</div></div>
        <div class="stat"><div class="k">Filled</div><div class="v">${s.filled_count ?? 0}</div></div>`;
      const items = data.items || [];
      if (!items.length) {
        document.getElementById("table-wrap").innerHTML = `<div class="empty">No execution records yet. Match <b>InpTradingMode</b> on executor with <b>InpSwingTradeMode</b> on advisory EA.</div>`;
        return;
      }
      const rows = items.map(i => `<tr>
        <td>${(i.created_utc || "").replace("T", " ").slice(0, 19)}</td>
        <td>${i.trade_mode || "SWING"}</td>
        <td><span class="pill ${i.status}">${i.status}</span></td>
        <td>${i.side} ${i.symbol}</td>
        <td>${fmt(i.stop_loss)} / ${fmt(i.take_profit)}</td>
        <td>${Math.round(i.confidence || 0)}%</td>
        <td>${i.ticket || "—"}</td>
        <td style="color:var(--muted);font-size:.74rem">${i.reason || ""}</td>
      </tr>`).join("");
      document.getElementById("table-wrap").innerHTML = `<table>
        <thead><tr><th>Time</th><th>Mode</th><th>Status</th><th>Side</th><th>SL / TP</th><th>Conf</th><th>Ticket</th><th>Note</th></tr></thead>
        <tbody>${rows}</tbody></table>`;
    }
    async function tick() {
      try {
        const q = filterMode ? `&mode=${encodeURIComponent(filterMode)}` : "";
        const r = await fetch(`/api/v1/execution/history?limit=40${q}`);
        render(await r.json());
      } catch (e) {
        document.getElementById("table-wrap").innerHTML = `<div class="empty">Failed to load: ${e}</div>`;
      }
    }
    tick();
    setInterval(tick, 8000);
  </script>
</body>
</html>
