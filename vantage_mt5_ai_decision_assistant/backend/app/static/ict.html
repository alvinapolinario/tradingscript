<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ICT Strategy · Vantage</title>
  <link rel="stylesheet" href="/static/shell.css" />
  <style>
    :root {
      --bg: #0a0e14; --panel: #121824; --line: #263044; --text: #e8eef8;
      --muted: #8a96aa; --accent: #7eb8ff; --good: #3dd68c; --warn: #e8c547;
      --bad: #f07178; --mono: "Cascadia Code", Consolas, ui-monospace, monospace;
    }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }
    header { padding: .9rem 1.25rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 1.05rem; }
    .sub { color: var(--muted); font-size: .76rem; margin-top: .25rem; max-width: 680px; }
    main { max-width: 1080px; margin: 0 auto; padding: 1rem 1rem 2.5rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .7rem; }
    .span2 { grid-column: span 2; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: .85rem .95rem; }
    .hero { background: linear-gradient(135deg, #152033, var(--panel)); border-color: #33415a; }
    .k { font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .v { font-family: var(--mono); font-size: .9rem; font-weight: 650; margin-top: .2rem; }
    .sig { font-size: 1.35rem; font-weight: 800; color: var(--accent); margin: .35rem 0; }
    .score { font-size: 2rem; font-weight: 800; color: var(--accent); }
    .bar { height: 8px; background: rgba(38,48,68,.8); border-radius: 999px; overflow: hidden; margin-top: .35rem; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 999px; }
    .row { display: flex; justify-content: space-between; gap: .5rem; margin-top: .35rem; align-items: baseline; }
    .pill { font-size: .72rem; font-weight: 700; padding: .3rem .6rem; border-radius: 999px; border: 1px solid var(--line); }
    .pill.buy { color: var(--good); border-color: rgba(61,214,140,.4); }
    .pill.sell { color: var(--bad); border-color: rgba(240,113,120,.4); }
    .pill.wait, .pill.watch { color: var(--warn); }
    .pill.invalid, .pill.no_trade { color: var(--bad); }
    .pill.muted { color: var(--muted); }
    .explain { color: var(--muted); font-size: .84rem; line-height: 1.6; margin: 0; }
    .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 1.5rem; color: var(--muted); text-align: center; line-height: 1.5; }
    .warn-box { border: 1px solid rgba(232,197,71,.45); background: rgba(232,197,71,.08); border-radius: 12px; padding: .75rem .9rem; color: var(--warn); margin-bottom: .7rem; font-size: .84rem; }
    .info-box { border: 1px solid rgba(126,184,255,.35); background: rgba(126,184,255,.06); border-radius: 12px; padding: .75rem .9rem; color: var(--accent); margin-bottom: .7rem; font-size: .84rem; }
    .checklist { list-style: none; padding: 0; margin: .5rem 0 0; }
    .checklist li { display: flex; justify-content: space-between; gap: .5rem; padding: .35rem 0; border-bottom: 1px solid rgba(38,48,68,.6); font-size: .82rem; }
    .checklist li:last-child { border-bottom: none; }
    .tag { font-size: .68rem; font-weight: 700; padding: .15rem .45rem; border-radius: 6px; }
    .tag.ok { background: rgba(61,214,140,.15); color: var(--good); }
    .tag.pending { background: rgba(138,150,170,.12); color: var(--muted); }
    .tag.active { background: rgba(232,197,71,.12); color: var(--warn); }
    .tag.fail { background: rgba(240,113,120,.12); color: var(--bad); }
    ul.reasons { margin: .5rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: .84rem; line-height: 1.55; }
    .timeline { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .65rem; }
    .tl-step { flex: 1 1 calc(33% - .45rem); min-width: 140px; border: 1px solid var(--line); border-radius: 10px; padding: .55rem .65rem; background: rgba(10,14,20,.35); }
    .tl-step.done { border-color: rgba(61,214,140,.35); }
    .tl-step.active { border-color: rgba(232,197,71,.45); background: rgba(232,197,71,.06); }
    .tl-step.pending { opacity: .72; }
    .tl-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .tl-status { font-size: .78rem; font-weight: 700; margin-top: .2rem; }
    .tl-status.done { color: var(--good); }
    .tl-status.active { color: var(--warn); }
    .tl-status.pending { color: var(--muted); }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .span2 { grid-column: span 1; } .tl-step { flex: 1 1 100%; } }
  </style>
</head>
<body data-nav="ict">
  <header>
    <div>
      <h1>ICT Strategy Engine</h1>
      <div class="sub">XAUUSD / Gold · liquidity sweep → displacement → MSS → FVG retrace · advisory only — never auto-trades</div>
    </div>
    <span id="pill" class="pill wait">—</span>
  </header>
  <main id="main"><div class="empty">Loading…</div></main>
  <script src="/static/shell.js"></script>
  <script>
    const STEP_LABELS = {
      HTF_BIAS: "HTF bias",
      LIQUIDITY: "Liquidity map",
      SWEEP: "Liquidity sweep",
      DISPLACEMENT: "Displacement",
      MSS: "Market structure shift",
      FVG: "Fair value gap",
      RETRACE: "Retrace",
      ENTRY: "Entry trigger",
      TP: "Target reached",
    };

    function fmt(n, d = 2) { return n == null || isNaN(Number(n)) || Number(n) === 0 ? "—" : Number(n).toFixed(d); }
    function decClass(d) {
      const u = String(d || "").toUpperCase();
      if (u === "BUY") return "buy";
      if (u === "SELL") return "sell";
      if (u === "WAIT") return "wait";
      if (u === "NO_TRADE" || u === "INVALIDATED") return "no_trade";
      return "muted";
    }
    function gateTag(ok) {
      return ok
        ? '<span class="tag ok">Pass</span>'
        : '<span class="tag fail">Fail</span>';
    }
    function renderTimeline(items) {
      const list = Array.isArray(items) ? items : [];
      if (!list.length) {
        return `<p class="explain" style="margin-top:.5rem">No setup timeline yet — waiting for ICT sequence on closed bars.</p>`;
      }
      return `<div class="timeline">${list.map((it) => {
        const step = it.step || "—";
        const status = String(it.status || "pending").toLowerCase();
        const label = STEP_LABELS[step] || step.replace(/_/g, " ");
        return `<div class="tl-step ${status}">
          <div class="tl-label">${label}</div>
          <div class="tl-status ${status}">${status}</div>
        </div>`;
      }).join("")}</div>`;
    }
    function render(p) {
      const root = document.getElementById("main");
      const i = p.ict;
      const dig = p.digits || 2;
      const pill = document.getElementById("pill");

      if (!i) {
        pill.textContent = p.ea_online ? "waiting" : "offline";
        pill.className = "pill muted";
        if (!p.ea_online) {
          root.innerHTML = `<div class="empty">
            EA offline. Attach the Vantage EA on <b>XAUUSD</b>, or run offline analysis via
            <code>POST /api/v1/ict/analyze</code> with multi-TF candle data.
            ${p.backend_engine_available ? "<br/><br/>Backend ICT engine is available for offline analyze." : ""}
          </div>`;
          return;
        }
        if (!p.ict_supported) {
          const mods = p.modules_detected || {};
          const modLines = [
            mods.amd_ifvg ? "AMD + iFVG: detected" : "AMD + iFVG: not in heartbeat",
            mods.box_theory ? "Box Theory: detected" : "Box Theory: not in heartbeat",
            mods.ict ? "ICT: detected" : "ICT: not in heartbeat",
          ].join("<br/>");
          root.innerHTML = `<div class="empty">
            <b>EA connected</b> on <b>${p.symbol || "—"}</b>, but this EA build is not sending <code>ict</code> yet.<br/><br/>
            <span style="color:var(--muted);font-size:.84rem">${modLines}</span><br/><br/>
            Use the Python backend via <code>POST /api/v1/ict/analyze</code> until MQL5 ICT wiring ships.
          </div>`;
          return;
        }
        root.innerHTML = `<div class="empty">Scanning closed bars for ICT setup on ${p.symbol || "XAUUSD"}…</div>`;
        return;
      }

      if (i.gold_symbol_valid === false && i.valid !== false) {
        pill.textContent = "wrong symbol";
        pill.className = "pill muted";
        root.innerHTML = `<div class="warn-box">${i.disable_reason || "Gold / XAUUSD only."}</div>`;
        return;
      }

      const dec = i.decision || "NO_TRADE";
      pill.textContent = dec.replace(/_/g, " ");
      pill.className = "pill " + decClass(dec);

      const htf = i.htf_bias || {};
      const liq = i.liquidity || {};
      const struct = i.structure || {};
      const fvg = i.fvg || {};
      const entry = i.entry || {};
      const sl = i.stop_loss || {};
      const targets = Array.isArray(i.targets) ? i.targets : [];
      const reasons = Array.isArray(i.reasons) ? i.reasons : [];
      const invalidations = Array.isArray(i.invalidations) ? i.invalidations : [];
      const warnings = Array.isArray(i.warnings) ? i.warnings : (i.warnings ? [i.warnings] : []);
      const gates = i.score_gates || {};
      const penalties = i.score_penalties || [];
      const conf = Math.round(i.confidence_score || i.confidence || 0);
      const setupState = String(i.setup_state || i.status || "—").replace(/_/g, " ");

      const backendNote = (!p.ea_online && p.backend_engine_available)
        ? `<div class="info-box">Showing backend ICT analysis (EA offline). Last result from engine state / history.</div>`
        : "";

      const warnHtml = warnings.length
        ? `<div class="warn-box">${warnings.join(" · ")}</div>` : "";

      const gateItems = [
        ["Liquidity sweep", gates.liquidity_sweep],
        ["Displacement", gates.displacement],
        ["MSS", gates.mss],
        ["FVG", gates.fvg],
      ].map(([label, ok]) => `<li><span>${label}</span>${gateTag(!!ok)}</li>`).join("");

      const penaltyHtml = penalties.length
        ? `<div class="row"><span class="k">Penalties</span><span class="v">${penalties.join(", ")}</span></div>`
        : "";

      const tpHtml = targets.map((t) =>
        `<div class="row"><span class="k">${t.name || t.label || "TP"}</span><span class="v">${fmt(t.price, dig)} · ${t.reason || ""}${t.rr != null ? " (" + t.rr + "R)" : ""}</span></div>`
      ).join("");

      const htfEvidence = Array.isArray(htf.evidence) ? htf.evidence : [];

      root.innerHTML = `
        ${backendNote}
        ${warnHtml}
        <div class="grid">
          <div class="card hero span2">
            <div class="k">ICT · ${i.symbol || p.symbol || "—"} · ${i.timeframe || "M15"} · ${setupState}</div>
            <div class="sig">${dec}</div>
            <p class="explain">${i.action_guidance || i.technical_narrative || "Monitoring ICT sequence on closed bars."}</p>
            <div class="row" style="margin-top:.65rem">
              <div><div class="k">Confidence</div><div class="score">${conf}%</div></div>
              <div><div class="k">Quality</div><div class="v">${i.signal_quality || "—"}</div></div>
              <div><div class="k">HTF bias</div><div class="v">${htf.direction || "—"}</div></div>
              <div><div class="k">Session</div><div class="v">${i.session || "—"}</div></div>
            </div>
            <div class="bar"><i style="width:${Math.min(100, conf)}%"></i></div>
            <div class="row"><span class="k">Setup ID</span><span class="v" style="font-size:.78rem">${i.setup_id || "—"}</span></div>
          </div>

          <div class="card">
            <div class="k">HTF bias</div>
            <div class="v">${htf.direction || "—"} · ${htf.confidence != null ? Math.round(htf.confidence) + "%" : "—"}</div>
            <ul class="reasons">${htfEvidence.map((e) => `<li>${e}</li>`).join("") || "<li>—</li>"}</ul>
          </div>

          <div class="card">
            <div class="k">Liquidity sweep</div>
            <div class="v">${liq.sweep_detected ? (liq.type || "Sweep") : "—"}</div>
            <div class="row"><span class="k">Level / sweep</span><span class="v">${fmt(liq.level, dig)} / ${fmt(liq.sweep_price, dig)}</span></div>
            <div class="row"><span class="k">BSL / SSL pools</span><span class="v">${liq.bsl_count ?? "—"} / ${liq.ssl_count ?? "—"}</span></div>
          </div>

          <div class="card">
            <div class="k">Structure</div>
            <div class="v">${struct.mss || (struct.mss_detail && struct.mss_detail.shift_detected ? "MSS" : "—")}</div>
            <div class="row"><span class="k">Displacement</span><span class="v">${struct.displacement ? "✅ " + fmt(struct.displacement_score, 0) : "—"}</span></div>
          </div>

          <div class="card">
            <div class="k">Fair value gap</div>
            <div class="v">${fvg.direction ? fvg.direction + " FVG" : "—"}</div>
            <div class="row"><span class="k">Zone</span><span class="v">${fmt(fvg.low, dig)} – ${fmt(fvg.high, dig)}</span></div>
            <div class="row"><span class="k">Mid / mitigation</span><span class="v">${fmt(fvg.midpoint, dig)} · ${fvg.mitigation != null ? Math.round(fvg.mitigation) + "%" : "—"}</span></div>
          </div>

          <div class="card span2">
            <div class="k">Setup timeline</div>
            ${renderTimeline(i.timeline)}
          </div>

          <div class="card span2">
            <div class="k">Trade plan (advisory)</div>
            <div class="row"><span class="k">Entry zone</span><span class="v">${fmt(entry.zone_low, dig)} – ${fmt(entry.zone_high, dig)}</span></div>
            <div class="row"><span class="k">Entry midpoint</span><span class="v">${fmt(entry.midpoint, dig)} · ${entry.status || "—"}</span></div>
            <div class="row"><span class="k">Stop loss</span><span class="v">${fmt(sl.price, dig)}${sl.reason ? " · " + sl.reason : ""}</span></div>
            ${tpHtml}
            <div class="row"><span class="k">Risk / reward</span><span class="v">1:${fmt(i.risk_reward, 1)}</span></div>
            <div class="row"><span class="k">Premium / discount</span><span class="v">${i.premium_discount_zone || "—"}</span></div>
          </div>

          <div class="card">
            <div class="k">Score gates</div>
            <ul class="checklist">${gateItems}</ul>
            ${penaltyHtml}
          </div>

          <div class="card">
            <div class="k">Invalidations</div>
            <ul class="reasons">${invalidations.map((x) => `<li>${x}</li>`).join("") || "<li>None flagged</li>"}</ul>
          </div>

          <div class="card span2">
            <div class="k">Evidence / reasons</div>
            <ul class="reasons">${reasons.map((r) => `<li>${r}</li>`).join("") || "<li>Scanning closed bars…</li>"}</ul>
          </div>
        </div>`;
    }

    async function refresh() {
      try {
        const r = await fetch("/api/v1/ict/status");
        render(await r.json());
      } catch (e) {
        document.getElementById("main").innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
      }
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
