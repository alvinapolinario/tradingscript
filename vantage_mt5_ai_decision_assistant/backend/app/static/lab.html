<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strategy Lab · Vantage</title>
  <link rel="stylesheet" href="/static/shell.css" />
  <style>
    :root {
      --bg: #070a0b; --panel: #101518; --line: #243035; --text: #e8f0ee;
      --muted: #7f9490; --ok: #00e887; --bad: #ff5c6a; --warn: #e8c547; --accent: #10b981;
      --sans: "Segoe UI", system-ui, sans-serif; --mono: Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--sans); color: var(--text); min-height: 100vh;
      background: radial-gradient(700px 320px at 60% 0%, #123028 0%, transparent 55%), var(--bg);
    }
    header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem;
      padding: .85rem 1.1rem; border-bottom: 1px solid var(--line); background: rgba(7,10,11,.92);
      position: sticky; top: 0; z-index: 5;
    }
    h1 { margin: 0; font-size: 1.05rem; }
    .sub { color: var(--muted); font-size: .78rem; margin-top: .15rem; }
    .actions { display: flex; gap: .45rem; flex-wrap: wrap; }
    button {
      border: 1px solid var(--line); border-radius: 10px; padding: .45rem .8rem; font-size: .8rem;
      background: var(--panel); color: var(--text); cursor: pointer; font: inherit;
    }
    button.primary { background: linear-gradient(180deg,#14f09a,#00c874); color: #04140e; border: 0; font-weight: 700; }
    main { max-width: 1100px; margin: 0 auto; padding: 1rem 1.1rem 2.5rem;
      display: grid; grid-template-columns: 1.1fr .9fr; gap: .85rem; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; }
    .k { font-size: .65rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .field { display: grid; grid-template-columns: 1fr auto; gap: .35rem; align-items: center; margin: .65rem 0; }
    .field label { font-size: .85rem; }
    .field .hint { grid-column: 1 / -1; font-size: .72rem; color: var(--muted); }
    input {
      width: 7rem; border: 1px solid var(--line); border-radius: 8px; background: #0c1213;
      color: var(--text); padding: .35rem .5rem; font-family: var(--mono);
    }
    .verdict { font-size: 1.2rem; font-weight: 800; margin: .35rem 0; }
    .gate { display: flex; justify-content: space-between; gap: .5rem; padding: .4rem 0; border-top: 1px solid var(--line); font-size: .8rem; }
    .pass { color: var(--ok); } .fail { color: var(--bad); } .warn, .unknown { color: var(--warn); }
    .note { font-size: .75rem; color: var(--muted); margin-top: .75rem; line-height: 1.4; }
  </style>
</head>
<body data-nav="lab">
  <header>
    <div>
      <h1>Strategy Lab</h1>
      <div class="sub">What-if playbook knobs · advisory session overrides</div>
    </div>
    <div class="actions">
      <button type="button" id="simBtn">Simulate</button>
      <button class="primary" type="button" id="applyBtn">Apply to session</button>
      <button type="button" id="resetBtn">Reset</button>
    </div>
  </header>
  <main>
    <section class="card">
      <div class="k">Playbook parameters</div>
      <div id="fields"></div>
      <div class="note" id="note"></div>
    </section>
    <section class="card">
      <div class="k">Live evaluation · <span id="sym">—</span></div>
      <div class="verdict" id="verdict">—</div>
      <div id="headline" style="color:var(--muted);font-size:.85rem;margin-bottom:.75rem"></div>
      <div id="gates"></div>
    </section>
  </main>
  <script>
    const FIELD_META = {};
    function collect() {
      const body = {};
      document.querySelectorAll("[data-key]").forEach((inp) => {
        if (inp.value !== "") body[inp.dataset.key] = inp.value;
      });
      return body;
    }
    function render(j) {
      document.getElementById("sym").textContent = j.symbol || "—";
      document.getElementById("verdict").textContent = (j.verdict || {}).verdict || "—";
      document.getElementById("headline").textContent = (j.verdict || {}).headline || "";
      document.getElementById("note").textContent = j.note || "";
      const root = document.getElementById("fields");
      if (!root.dataset.ready) {
        root.innerHTML = (j.fields || []).map((f) => `
          <div class="field">
            <label>${f.label}<div class="hint">Base ${f.base} · ${f.hint || ""}</div></label>
            <input data-key="${f.key}" type="number" step="any" value="${f.value}" />
          </div>`).join("");
        root.dataset.ready = "1";
      } else {
        (j.fields || []).forEach((f) => {
          const inp = document.querySelector(`[data-key="${f.key}"]`);
          if (inp && document.activeElement !== inp) inp.value = f.value;
        });
      }
      document.getElementById("gates").innerHTML = (j.gates || []).map((g) => `
        <div class="gate">
          <span>${g.label}</span>
          <span class="${g.status}">${(g.status || "").toUpperCase()} · ${g.detail || ""}</span>
        </div>`).join("");
    }
    async function load() {
      const r = await fetch("/api/v1/lab/status");
      render(await r.json());
    }
    async function post(url) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(collect()),
      });
      render(await r.json());
    }
    document.getElementById("simBtn").addEventListener("click", () => post("/api/v1/lab/simulate"));
    document.getElementById("applyBtn").addEventListener("click", () => post("/api/v1/lab/apply"));
    document.getElementById("resetBtn").addEventListener("click", async () => {
      const r = await fetch("/api/v1/lab/reset", { method: "POST" });
      const root = document.getElementById("fields");
      root.dataset.ready = "";
      render(await r.json());
    });
    load();
  </script>
  <script src="/static/shell.js"></script>
</body>
</html>
