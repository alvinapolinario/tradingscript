<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strategy Scanner · Vantage</title>
  <link rel="stylesheet" href="/static/shell.css" />
  <style>
    :root {
      --bg: #070a0b; --panel: #101518; --line: #243035; --text: #e8f0ee;
      --muted: #7f9490; --ok: #00e887; --bad: #ff5c6a; --warn: #e8c547;
      --sans: "Segoe UI", system-ui, sans-serif; --mono: Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--sans); color: var(--text); min-height: 100vh;
      background: radial-gradient(700px 320px at 20% 0%, #123028 0%, transparent 55%), var(--bg);
    }
    header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem;
      padding: .85rem 1.1rem; border-bottom: 1px solid var(--line); background: rgba(7,10,11,.92);
      position: sticky; top: 0; z-index: 5;
    }
    h1 { margin: 0; font-size: 1.05rem; }
    .sub { color: var(--muted); font-size: .78rem; margin-top: .15rem; }
    .actions { display: flex; gap: .45rem; flex-wrap: wrap; }
    .pill, button {
      border: 1px solid var(--line); border-radius: 999px; padding: .35rem .7rem; font-size: .78rem;
      background: var(--panel); color: var(--text); cursor: pointer; font: inherit;
    }
    button.primary { background: linear-gradient(180deg,#14f09a,#00c874); color: #04140e; border: 0; font-weight: 700; }
    main { max-width: 1100px; margin: 0 auto; padding: 1rem 1.1rem 2.5rem; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    th, td { text-align: left; padding: .7rem .75rem; border-bottom: 1px solid var(--line); font-size: .84rem; }
    th { color: var(--muted); font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: rgba(255,255,255,.02); }
    .mono { font-family: var(--mono); }
    .ok { color: var(--ok); font-weight: 700; }
    .bad { color: var(--bad); font-weight: 700; }
    .warn { color: var(--warn); font-weight: 700; }
    .sel { cursor: pointer; color: #9fd6ff; text-decoration: underline; }
  </style>
</head>
<body data-nav="scanner">
  <header>
    <div>
      <h1>Strategy Scanner</h1>
      <div class="sub">Rank pairs by M5 desk readiness — advisory only</div>
    </div>
    <div class="actions">
      <span class="pill" id="sumPill">—</span>
      <button class="primary" id="refreshBtn" type="button">Rescan</button>
    </div>
  </header>
  <main>
    <table>
      <thead>
        <tr>
          <th>Symbol</th><th>Score</th><th>Verdict</th><th>Side</th>
          <th>Gates</th><th>ADX</th><th>Spread</th><th>R:R</th><th></th>
        </tr>
      </thead>
      <tbody id="body"><tr><td colspan="9">Loading…</td></tr></tbody>
    </table>
  </main>
  <script>
    function toneClass(t) {
      if (t === "ok") return "ok";
      if (t === "bad") return "bad";
      return "warn";
    }
    async function selectSymbol(sym) {
      await fetch("/api/v1/monitor/select-symbol", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symbol: sym }),
      });
      location.href = "/analyzer";
    }
    async function refresh() {
      const r = await fetch("/api/v1/scanner/status");
      const j = await r.json();
      document.getElementById("sumPill").textContent =
        `${j.setup_ok_count || 0} SETUP_OK · ${j.count || 0} pairs`;
      const rows = j.items || [];
      document.getElementById("body").innerHTML = rows.length ? rows.map((x) => `
        <tr>
          <td class="mono">${x.symbol}</td>
          <td class="mono">${x.score}</td>
          <td class="${toneClass(x.tone)}">${x.verdict || "—"}</td>
          <td>${x.side || "—"}</td>
          <td class="mono">${x.gates_pass}/${x.gates_total}</td>
          <td class="mono">${x.adx14 ?? "—"}</td>
          <td class="mono">${x.spread_points ?? "—"}</td>
          <td class="mono">${x.reward_risk_ratio ?? "—"}</td>
          <td><span class="sel" data-sym="${x.symbol}">Open Analyzer</span></td>
        </tr>`).join("") : `<tr><td colspan="9">No pairs yet — attach EA heartbeats</td></tr>`;
      document.querySelectorAll(".sel").forEach((el) => {
        el.addEventListener("click", () => selectSymbol(el.dataset.sym));
      });
    }
    document.getElementById("refreshBtn").addEventListener("click", refresh);
    refresh();
    setInterval(refresh, 15000);
  </script>
  <script src="/static/shell.js"></script>
</body>
</html>
