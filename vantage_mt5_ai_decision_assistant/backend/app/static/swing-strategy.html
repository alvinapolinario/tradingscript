<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swing Strategy · Vantage</title>
  <link rel="stylesheet" href="/static/shell.css" />
  <style>
    :root {
      --bg: #0a0e14; --panel: #121824; --line: #263044; --text: #e8eef8;
      --muted: #8a96aa; --accent: #7eb8ff; --good: #3dd68c; --warn: #e8c547;
      --bad: #f07178; --mono: "Cascadia Code", Consolas, ui-monospace, monospace;
    }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }
    header { padding: .9rem 1.25rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
    header h1 { margin: 0; font-size: 1.05rem; }
    .sub { color: var(--muted); font-size: .76rem; margin-top: .25rem; }
    main { max-width: 1080px; margin: 0 auto; padding: 1rem 1rem 2.5rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .7rem; }
    .span2 { grid-column: span 2; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: .85rem .95rem; }
    .hero { background: linear-gradient(135deg, #152033, var(--panel)); border-color: #33415a; }
    .k { font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .v { font-family: var(--mono); font-size: .9rem; font-weight: 650; margin-top: .2rem; }
    .sig { font-size: 1.25rem; font-weight: 800; color: var(--accent); margin: .35rem 0; }
    .row { display: flex; justify-content: space-between; gap: .5rem; margin-top: .35rem; align-items: baseline; }
    .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; margin-top: .55rem; }
    .score-box { background: #161d2b; border: 1px solid var(--line); border-radius: 10px; padding: .45rem .55rem; text-align: center; }
    .score-box b { display: block; font-family: var(--mono); font-size: 1rem; color: var(--good); }
    .pill { font-size: .72rem; font-weight: 700; padding: .3rem .6rem; border-radius: 999px; border: 1px solid var(--line); }
    .pill.buy { color: var(--good); border-color: rgba(61,214,140,.4); }
    .pill.sell { color: var(--bad); border-color: rgba(240,113,120,.4); }
    .pill.wait { color: var(--warn); }
    .explain { color: var(--muted); font-size: .84rem; line-height: 1.6; margin: 0; }
    .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 1.5rem; color: var(--muted); text-align: center; }
    @media (max-width: 820px) { .grid, .scores { grid-template-columns: 1fr; } .span2 { grid-column: span 1; } }
  </style>
</head>
<body data-nav="swing-strategy">
  <header>
    <div>
      <h1>Swing Strategy Engine</h1>
      <div class="sub">XAUUSD, EURUSD, USDJPY · multi-TF SMC swing validation · advisory — never auto-trades</div>
    </div>
    <span id="modePill" class="pill wait">—</span>
    <span id="pill" class="pill wait">—</span>
  </header>
  <main id="main"><div class="empty">Loading…</div></main>
  <script src="/static/shell.js"></script>
  <script>
    function fmt(n, d = 2) { return n == null || isNaN(Number(n)) ? "—" : Number(n).toFixed(d); }
    function sigClass(s) {
      const u = String(s || "").toUpperCase();
      if (u.includes("SCALP") && u.includes("BUY")) return "buy";
      if (u.includes("SCALP") && u.includes("SELL")) return "sell";
      if (u.includes("BUY")) return "buy";
      if (u.includes("SELL")) return "sell";
      return "wait";
    }
    let lastSig = "";
    function signature(s) {
      return [s?.eval_bar_m5, s?.signal, s?.confidence, s?.current_phase].join("|");
    }
    function render(p) {
      const root = document.getElementById("main");
      const s = p.swing_strategy;
      if (!p.ea_online) { root.innerHTML = `<div class="empty">EA offline — attach on XAUUSD.</div>`; return; }
      if (!p.swing_strategy_supported || !s) {
        root.innerHTML = `<div class="empty">EA not sending <b>swing_strategy</b>. Recompile with groups AK–AO enabled.</div>`;
        return;
      }
      if (!s.gold_symbol_valid) { root.innerHTML = `<div class="empty">${s.disable_reason || "Supported pairs: XAUUSD, EURUSD, USDJPY."}</div>`; return; }

      const sig = signature(s);
      const pill = document.getElementById("pill");
      const modePill = document.getElementById("modePill");
      pill.textContent = s.signal || "NO TRADE";
      pill.className = "pill " + sigClass(s.signal);
      modePill.textContent = s.trade_mode || "SWING";
      modePill.className = "pill " + ((s.trade_mode || "").toUpperCase() === "SCALPING" ? "sell" : "wait");
      if (sig === lastSig && root.dataset.ready === "1") return;
      lastSig = sig; root.dataset.ready = "1";

      const ez = s.entry_zone || [];
      root.innerHTML = `
        <div class="grid">
          <div class="card hero span2">
            <div class="k">Trade Decision</div>
            <div class="sig">${s.signal || "NO TRADE"}</div>
            <div class="row"><span class="k">Confidence</span><span class="v">${Math.round(s.confidence || 0)}%</span></div>
            <div class="row"><span class="k">Entry Quality</span><span class="v">${s.entry_quality || "—"}</span></div>
            <div class="row"><span class="k">Trade Bias</span><span class="v">${s.trade_bias || "—"}</span></div>
            <p class="explain" style="margin-top:.75rem">${s.reason || ""}</p>
          </div>

          <div class="card">
            <div class="k">Trend & Structure</div>
            <div class="v">${s.trend || "—"} · ${s.market_structure || "—"}</div>
            <div class="row"><span class="k">Phase</span><span class="v">${s.current_phase || "—"}</span></div>
            <div class="row"><span class="k">Swing Direction</span><span class="v">${s.swing_direction || "—"}</span></div>
            <div class="row"><span class="k">Regime</span><span class="v">${s.structure_regime || "—"}</span></div>
            <div class="row"><span class="k">Internal / External</span><span class="v">${s.internal_structure || "—"} / ${s.external_structure || "—"}</span></div>
          </div>

          <div class="card">
            <div class="k">Swings & Pullback</div>
            <div class="row"><span class="k">Current Swing</span><span class="v">${fmt(s.current_swing_price)}</span></div>
            <div class="row"><span class="k">Previous Swing</span><span class="v">${fmt(s.previous_swing_price)}</span></div>
            <div class="row"><span class="k">Pullback</span><span class="v">${fmt(s.pullback_pct, 0)}% · ${s.pullback_quality || "—"}</span></div>
            <div class="row"><span class="k">ATR H4</span><span class="v">${fmt(s.atr_h4)}</span></div>
          </div>

          <div class="card span2">
            <div class="k">AI Confidence Scores</div>
            <div class="scores">
              <div class="score-box"><span class="k">Trend</span><b>${Math.round(s.trend_score || 0)}</b></div>
              <div class="score-box"><span class="k">Swing</span><b>${Math.round(s.swing_score || 0)}</b></div>
              <div class="score-box"><span class="k">Momentum</span><b>${Math.round(s.momentum_score || 0)}</b></div>
              <div class="score-box"><span class="k">SMC</span><b>${Math.round(s.smc_score || 0)}</b></div>
              <div class="score-box"><span class="k">Liquidity</span><b>${Math.round(s.liquidity_score || 0)}</b></div>
              <div class="score-box"><span class="k">Breakout</span><b>${Math.round(s.breakout_score || 0)}</b></div>
            </div>
            <div class="row" style="margin-top:.55rem"><span class="k">SMC</span><span class="v">${s.smc_summary || "—"}</span></div>
            <div class="row"><span class="k">Momentum</span><span class="v">${s.momentum_summary || "—"}</span></div>
          </div>

          <div class="card">
            <div class="k">Risk & Reward</div>
            <div class="row"><span class="k">Entry Zone</span><span class="v">${fmt(ez[0])} – ${fmt(ez[1])}</span></div>
            <div class="row"><span class="k">Stop Loss</span><span class="v">${fmt(s.stop_loss)}</span></div>
            <div class="row"><span class="k">Invalidation</span><span class="v">${fmt(s.invalidation)}</span></div>
            <div class="row"><span class="k">TP1 / TP2 / TP3</span><span class="v">${fmt(s.tp1)} / ${fmt(s.tp2)} / ${fmt(s.tp3)}</span></div>
            <div class="row"><span class="k">Risk : Reward</span><span class="v">${s.risk_reward || "—"}</span></div>
          </div>

          <div class="card">
            <div class="k">Breakout Validation</div>
            <div class="v">${s.breakout_summary || "—"}</div>
            <div class="row" style="margin-top:.5rem"><span class="k">Breakout Score</span><span class="v">${Math.round(s.breakout_score || 0)}</span></div>
          </div>

          <div class="card span2">
            <div class="k">Market Explanation</div>
            <p class="explain">${s.market_explanation || "—"}</p>
          </div>
        </div>
        <p style="color:var(--muted);font-size:.74rem;text-align:center;margin-top:1rem">Advisory swing intelligence — not a trade execution signal</p>`;
    }
    async function tick() {
      try { render(await (await fetch("/api/v1/swing-strategy/status")).json()); }
      catch { document.getElementById("main").innerHTML = `<div class="empty">Failed to load status</div>`; }
    }
    tick(); setInterval(tick, 5000);
  </script>
</body>
</html>
