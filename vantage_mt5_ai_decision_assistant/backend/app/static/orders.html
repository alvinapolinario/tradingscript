<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pending Orders · Vantage</title>
  <link rel="stylesheet" href="/static/shell.css" />
  <style>
    :root {
      --bg: #0b1210;
      --panel: #121c19;
      --line: #2a3d36;
      --text: #e8f2ed;
      --muted: #8aa399;
      --buy: #3dd68c;
      --sell: #f07575;
      --warn: #e8c547;
      --accent: #5ee0b5;
      --mono: "Cascadia Code", "Consolas", ui-monospace, monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(700px 320px at 10% 0%, #1a2830 0%, transparent 55%),
        var(--bg);
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem; flex-wrap: wrap;
      padding: .85rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: rgba(11,18,16,.92);
      position: sticky; top: 0; z-index: 5;
    }
    header h1 { margin: 0; font-size: 1.05rem; }
    header .sub { color: var(--muted); font-size: .78rem; margin-top: .15rem; }
    .actions { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; }
    .pill {
      display: inline-flex; align-items: center; gap: .35rem;
      border: 1px solid var(--line); border-radius: 999px;
      padding: .35rem .7rem; font-size: .78rem; background: var(--panel);
    }
    main { max-width: 960px; margin: 0 auto; padding: 1rem 1.1rem 2.5rem; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .55rem;
      margin-bottom: 1.1rem;
    }
    .kpi {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .7rem .8rem;
      min-width: 0;
    }
    .kpi .k {
      font-size: .65rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    }
    .kpi .v {
      font-family: var(--mono); font-size: 1.25rem; font-weight: 750; margin-top: .2rem;
    }
    .kpi .s { font-size: .72rem; color: var(--muted); margin-top: .15rem; }
    .kpi.buy .v { color: var(--buy); }
    .kpi.sell .v { color: var(--sell); }
    .kpi.warn .v { color: var(--warn); }
    .kpi.bad .v { color: var(--sell); }
    .ledger-title {
      font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin: .2rem 0 .85rem;
    }
    .empty {
      border: 1px dashed var(--line); border-radius: 14px;
      padding: 1.5rem; color: var(--muted); text-align: center; line-height: 1.5;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem 1.1rem;
      margin-bottom: .85rem;
    }
    .card.buy { border-color: rgba(61,214,140,.35); }
    .card.sell { border-color: rgba(240,117,117,.35); }
    .card-head {
      display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap;
      margin-bottom: .75rem;
    }
    .type {
      font-size: 1.15rem; font-weight: 800; letter-spacing: .02em;
    }
    .card.buy .type { color: var(--buy); }
    .card.sell .type { color: var(--sell); }
    .meta { color: var(--muted); font-size: .78rem; margin-top: .2rem; }
    .badge {
      font-size: .68rem; letter-spacing: .08em; text-transform: uppercase;
      border: 1px solid var(--line); border-radius: 999px;
      padding: .3rem .65rem; align-self: flex-start;
    }
    .badge.with { color: var(--buy); border-color: rgba(61,214,140,.4); }
    .badge.counter { color: var(--sell); border-color: rgba(240,117,117,.4); }
    .badge.mixed { color: var(--warn); border-color: rgba(232,197,71,.4); }
    .sug-title {
      font-size: .68rem; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: .35rem;
    }
    .sug-list {
      list-style: none; margin: 0 0 .85rem; padding: 0;
      display: flex; flex-direction: column; gap: .35rem;
    }
    .sug-list li {
      background: rgba(0,0,0,.22);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .45rem .65rem;
      font-size: .86rem; font-weight: 650;
    }
    .sug-list li.warn { color: var(--warn); }
    .sug-list li.bad { color: var(--sell); }
    .sug-list li.ok { color: var(--buy); }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .7rem; }
    .chip {
      font-size: .72rem; border: 1px solid var(--line); border-radius: 8px;
      padding: .28rem .5rem; color: var(--muted);
    }
    .chip strong { color: var(--text); font-weight: 650; }
    .grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: .55rem;
    }
    .col .k {
      font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    }
    .col .v {
      font-family: var(--mono); font-size: .9rem; font-weight: 650; margin-top: .15rem;
    }
    @media (max-width: 800px) {
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body data-nav="orders">
  <header>
    <div>
      <h1>Pending Orders</h1>
      <div class="sub">All MT5 pendings on the account · advisory only · never modifies orders</div>
    </div>
    <div class="actions">
      <span class="pill" id="scopePill">account</span>
      <span class="pill" id="countPill">0 orders</span>
    </div>
  </header>
  <main>
    <div class="kpi-grid" id="kpiGrid" hidden></div>
    <div class="ledger-title">All pending orders · suggestions first</div>
    <div id="list"><div class="empty">Loading…</div></div>
  </main>
  <script>
    const WARN = new Set(["ADD_OR_TIGHTEN_SL", "WAIT_FOR_FILL", "STACKED_WITH_OPEN_POSITION", "AGAINST_TREND"]);
    const BAD = new Set(["STALE_OR_INVALID", "SIZE_TOO_LARGE", "CONSIDER_CANCEL", "AGAINST_H1_BIAS"]);

    function fmtPx(n, digits) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      const d = digits != null ? digits : (Number(n) >= 100 ? 2 : 5);
      return Number(n).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
    }
    function fmtNum(n, d = 2) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      return Number(n).toLocaleString(undefined, { maximumFractionDigits: d });
    }
    function sugClass(s) {
      if (BAD.has(s)) return "bad";
      if (WARN.has(s)) return "warn";
      return "ok";
    }
    function trendClass(label) {
      if (label === "WITH_TREND") return "with";
      if (label === "COUNTER_TREND") return "counter";
      return "mixed";
    }
    function renderKpis(kpis) {
      const grid = document.getElementById("kpiGrid");
      if (!kpis) {
        grid.hidden = true;
        return;
      }
      grid.hidden = false;
      const symList = (kpis.symbol_list || []).join(", ") || "—";
      grid.innerHTML = `
        <div class="kpi"><div class="k">Total orders</div><div class="v">${kpis.total_orders ?? 0}</div><div class="s">${kpis.symbols ?? 0} symbol(s)</div></div>
        <div class="kpi buy"><div class="k">Buy side</div><div class="v">${kpis.buy_orders ?? 0}</div><div class="s">pending buy types</div></div>
        <div class="kpi sell"><div class="k">Sell side</div><div class="v">${kpis.sell_orders ?? 0}</div><div class="s">pending sell types</div></div>
        <div class="kpi"><div class="k">Total volume</div><div class="v">${fmtNum(kpis.total_volume, 4)}</div><div class="s">lots across book</div></div>
        <div class="kpi warn"><div class="k">Money @ SL</div><div class="v">${fmtNum(kpis.total_money_at_risk, 2)}</div><div class="s">sum when SL set</div></div>
        <div class="kpi warn"><div class="k">Equity risk</div><div class="v">${fmtNum(kpis.total_equity_risk_pct, 2)}%</div><div class="s">sum of order %</div></div>
        <div class="kpi buy"><div class="k">With trend</div><div class="v">${kpis.with_trend ?? 0}</div><div class="s">aligned to bias</div></div>
        <div class="kpi bad"><div class="k">Needs attention</div><div class="v">${(kpis.missing_sl || 0) + (kpis.oversize || 0) + (kpis.stale || 0)}</div><div class="s">no SL ${kpis.missing_sl || 0} · oversize ${kpis.oversize || 0} · stale ${kpis.stale || 0}</div></div>
      `;
      grid.title = `Symbols: ${symList}`;
    }
    function render(payload) {
      const root = document.getElementById("list");
      const items = payload.items || [];
      const kpis = payload.kpis || payload.summary || {};
      document.getElementById("scopePill").textContent = payload.scope || "account";
      document.getElementById("countPill").textContent =
        `${items.length} order${items.length === 1 ? "" : "s"}`;
      renderKpis({
        total_orders: kpis.total_orders ?? items.length,
        buy_orders: kpis.buy_orders ?? 0,
        sell_orders: kpis.sell_orders ?? 0,
        total_volume: kpis.total_volume ?? 0,
        total_money_at_risk: kpis.total_money_at_risk ?? 0,
        total_equity_risk_pct: kpis.total_equity_risk_pct ?? 0,
        with_trend: kpis.with_trend ?? 0,
        missing_sl: kpis.missing_sl ?? 0,
        oversize: kpis.oversize ?? 0,
        stale: kpis.stale ?? 0,
        symbols: kpis.symbols ?? (kpis.symbol_list || []).length,
        symbol_list: kpis.symbol_list || [],
      });

      if (!payload.ea_online) {
        root.innerHTML = `<div class="empty">EA offline.<br/>Start the Vantage EA on a chart so pending orders can sync via heartbeat.</div>`;
        return;
      }
      if (!payload.pending_orders_supported) {
        root.innerHTML = `<div class="empty">This EA build is not sending <b>pending_orders</b> yet.<br/>
          In MetaEditor: recompile <b>VantageMT5AIDecisionAssistant.mq5</b>, reload it on the chart, then wait ~15s for a heartbeat.<br/>
          Your MT5 Trade tab can show pendings while the web desk stays empty until that sync runs.</div>`;
        return;
      }
      if (!items.length) {
        root.innerHTML = `<div class="empty">No pending orders reported on the last EA heartbeat.<br/>If MT5 Trade still shows limits/stops, reload the EA and confirm Experts log shows heartbeat with pending=&gt;0.</div>`;
        return;
      }

      root.innerHTML = items.map((o) => {
        const side = (o.side || "").toLowerCase();
        const trend = o.trend || {};
        const risk = o.risk || {};
        const dig = o.digits || payload.digits || 2;
        const sugs = (o.suggestions || []).map((s) =>
          `<li class="${sugClass(s)}">${s.replaceAll("_", " ")}</li>`
        ).join("");
        return `<article class="card ${side}">
          <div class="card-head">
            <div>
              <div class="type">${o.type || "—"}</div>
              <div class="meta">${o.symbol || "—"} · #${o.ticket || "—"} · ${o.volume ?? "—"} lots</div>
            </div>
            <span class="badge ${trendClass(trend.label)}">${(trend.label || "MIXED").replaceAll("_", " ")}</span>
          </div>
          <div class="sug-title">Suggestions</div>
          <ul class="sug-list">${sugs || "<li class='ok'>KEEP WATCH</li>"}</ul>
          <div class="chips">
            <span class="chip">Risk <strong>${risk.label || "—"}</strong></span>
            <span class="chip">Equity @ SL <strong>${risk.equity_risk_pct != null ? risk.equity_risk_pct.toFixed(2) + "%" : "—"}</strong></span>
            <span class="chip">Money @ SL <strong>${risk.money_at_risk != null ? fmtPx(risk.money_at_risk, 2) : "—"}</strong></span>
            <span class="chip">R:R <strong>${risk.reward_risk_ratio != null ? risk.reward_risk_ratio.toFixed(2) : "—"}</strong></span>
            <span class="chip">To fill <strong>${fmtPx(risk.distance_price, dig)}</strong></span>
            ${risk.missing_sl ? '<span class="chip"><strong>No SL</strong></span>' : ""}
            ${risk.stale_or_invalid ? '<span class="chip"><strong>Stale</strong></span>' : ""}
          </div>
          <div class="grid">
            <div class="col"><div class="k">Entry</div><div class="v">${fmtPx(o.price_open, dig)}</div></div>
            <div class="col"><div class="k">Stop</div><div class="v">${fmtPx(o.sl, dig)}</div></div>
            <div class="col"><div class="k">Target</div><div class="v">${fmtPx(o.tp, dig)}</div></div>
            <div class="col"><div class="k">Setup</div><div class="v" style="font-size:.75rem">${o.time_setup || "—"}</div></div>
          </div>
        </article>`;
      }).join("");
    }
    async function refresh() {
      try {
        const r = await fetch("/api/v1/orders/pending");
        const j = await r.json();
        render(j);
      } catch (e) {
        document.getElementById("list").innerHTML =
          `<div class="empty">Failed to load pending orders</div>`;
      }
    }
    refresh();
    setInterval(refresh, 12000);
  </script>
  <script src="/static/shell.js"></script>
</body>
</html>
