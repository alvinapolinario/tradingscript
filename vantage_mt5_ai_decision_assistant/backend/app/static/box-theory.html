<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Box Theory · Vantage</title>
  <link rel="stylesheet" href="/static/shell.css" />
  <style>
    :root {
      --bg: #0a0e14; --panel: #121824; --line: #263044; --text: #e8eef8;
      --muted: #8a96aa; --accent: #7eb8ff; --good: #3dd68c; --warn: #e8c547;
      --bad: #f07178; --mono: "Cascadia Code", Consolas, ui-monospace, monospace;
    }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); background: var(--bg); min-height: 100vh; }
    header { padding: .9rem 1.25rem; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 1.05rem; }
    .sub { color: var(--muted); font-size: .76rem; margin-top: .25rem; max-width: 640px; }
    main { max-width: 1080px; margin: 0 auto; padding: 1rem 1rem 2.5rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .7rem; }
    .span2 { grid-column: span 2; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: .85rem .95rem; }
    .hero { background: linear-gradient(135deg, #152033, var(--panel)); border-color: #33415a; }
    .k { font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .v { font-family: var(--mono); font-size: .9rem; font-weight: 650; margin-top: .2rem; }
    .sig { font-size: 1.35rem; font-weight: 800; color: var(--accent); margin: .35rem 0; }
    .score { font-size: 2rem; font-weight: 800; color: var(--accent); }
    .bar { height: 8px; background: rgba(38,48,68,.8); border-radius: 999px; overflow: hidden; margin-top: .35rem; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--good)); border-radius: 999px; }
    .row { display: flex; justify-content: space-between; gap: .5rem; margin-top: .35rem; align-items: baseline; }
    .pill { font-size: .72rem; font-weight: 700; padding: .3rem .6rem; border-radius: 999px; border: 1px solid var(--line); }
    .pill.buy { color: var(--good); border-color: rgba(61,214,140,.4); }
    .pill.sell { color: var(--bad); border-color: rgba(240,113,120,.4); }
    .pill.wait, .pill.watch { color: var(--warn); }
    .pill.invalid { color: var(--bad); }
    .pill.muted { color: var(--muted); }
    .explain { color: var(--muted); font-size: .84rem; line-height: 1.6; margin: 0; }
    .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 1.5rem; color: var(--muted); text-align: center; line-height: 1.5; }
    .warn-box { border: 1px solid rgba(232,197,71,.45); background: rgba(232,197,71,.08); border-radius: 12px; padding: .75rem .9rem; color: var(--warn); margin-bottom: .7rem; font-size: .84rem; }
    ul.reasons { margin: .5rem 0 0; padding-left: 1.1rem; color: var(--muted); font-size: .84rem; line-height: 1.55; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .span2 { grid-column: span 1; } }
  </style>
</head>
<body data-nav="box-theory">
  <header>
    <div>
      <h1>Box Theory Strategy</h1>
      <div class="sub">XAUUSD / Gold · consolidation box → breakout → retest → confirmation · advisory only — never auto-trades</div>
    </div>
    <span id="pill" class="pill wait">—</span>
  </header>
  <main id="main"><div class="empty">Loading…</div></main>
  <script src="/static/shell.js"></script>
  <script>
    function fmt(n, d = 2) { return n == null || isNaN(Number(n)) || Number(n) === 0 ? "—" : Number(n).toFixed(d); }
    function sigClass(s) {
      const u = String(s || "").toUpperCase();
      if (u === "BUY") return "buy";
      if (u === "SELL") return "sell";
      if (u === "INVALID") return "invalid";
      if (u === "WATCH") return "watch";
      return "wait";
    }
    function actionLine(b) {
      const sig = String(b.signal || "").toUpperCase();
      const st = String(b.box_status || "").toUpperCase();
      if (sig === "BUY") return "BUY — confirmed setup (analysis only)";
      if (sig === "SELL") return "SELL — confirmed setup (analysis only)";
      if (sig === "INVALID") return "INVALID — trap or expired";
      if (st === "RETESTING") return "WAITING FOR RETEST CONFIRMATION";
      if (st === "VALID") return "WATCH — valid box, awaiting breakout";
      return "WAIT — monitoring box structure";
    }
    function render(p) {
      const root = document.getElementById("main");
      const b = p.box_theory;
      const dig = p.digits || 2;
      const pill = document.getElementById("pill");

      if (!p.ea_online) {
        pill.textContent = "offline";
        pill.className = "pill muted";
        root.innerHTML = `<div class="empty">EA offline. Attach the Vantage EA on XAUUSD or use POST /api/v1/box-theory/analyze with candle data.</div>`;
        return;
      }
      if (!p.box_theory_supported || !b) {
        pill.textContent = "unsupported";
        pill.className = "pill muted";
        const mods = p.modules_detected || {};
        const modLines = [
          mods.amd_ifvg ? "AMD + iFVG: detected" : "AMD + iFVG: not in heartbeat",
          mods.liquidity_grab ? "Liquidity Grab: detected" : "Liquidity Grab: not in heartbeat",
          mods.swing_strategy ? "Swing Strategy: detected" : "Swing Strategy: not in heartbeat",
          mods.box_theory ? "Box Theory: detected" : "Box Theory: not in heartbeat",
        ].join("<br/>");
        root.innerHTML = `<div class="empty">
          <b>EA connected</b> on <b>${p.symbol || "—"}</b>, but this EA build is not sending <code>box_theory</code> yet.<br/><br/>
          <span style="color:var(--muted);font-size:.84rem">${modLines}</span><br/><br/>
          <b>Fix:</b> copy the latest <code>MQL5/Include/VantageAI/</code> files, recompile
          <code>VantageMT5AIDecisionAssistant.mq5</code>, remove the old EA from the chart, attach the new one on <b>XAUUSD</b>,
          and confirm inputs <b>AT–AW</b> (Box Theory) are enabled.<br/><br/>
          Journal should show: <i>Box Theory Strategy enabled — heartbeat key box_theory active.</i>
        </div>`;
        return;
      }
      if (b.gold_symbol_valid === false && b.valid !== false) {
        pill.textContent = "wrong symbol";
        pill.className = "pill muted";
        root.innerHTML = `<div class="warn-box">${b.disable_reason || "Gold / XAUUSD only."}</div>`;
        return;
      }

      const sig = b.signal || "WAIT";
      pill.textContent = sig;
      pill.className = "pill " + sigClass(sig);

      const box = b.box || {};
      const br = b.breakout || {};
      const rt = b.retest || {};
      const sw = b.liquidity_sweep || {};
      const conf = Math.round(b.confidence_score || b.confidence || 0);
      const reasons = Array.isArray(b.reasons) ? b.reasons : [];

      root.innerHTML = `
        <div class="grid">
          <div class="card hero span2">
            <div class="k">BOX THEORY · ${b.symbol || "—"} · ${b.timeframe || "M15"}</div>
            <div class="sig">${sig}</div>
            <p class="explain">${actionLine(b)}</p>
            <div class="row" style="margin-top:.65rem">
              <div><div class="k">Status</div><div class="v">${(b.box_status || "—").replace(/_/g, " ")}</div></div>
              <div><div class="k">Direction</div><div class="v">${b.direction || "—"}</div></div>
              <div><div class="k">HTF bias</div><div class="v">${b.htf_bias || "—"}</div></div>
            </div>
          </div>

          <div class="card">
            <div class="k">Box High</div><div class="v">${fmt(box.high, dig)}</div>
            <div class="row"><span class="k">Upper touches</span><span class="v">${box.upper_touches ?? "—"}</span></div>
          </div>
          <div class="card">
            <div class="k">Box Low</div><div class="v">${fmt(box.low, dig)}</div>
            <div class="row"><span class="k">Lower touches</span><span class="v">${box.lower_touches ?? "—"}</span></div>
          </div>
          <div class="card">
            <div class="k">Box Mid</div><div class="v">${fmt(box.mid, dig)}</div>
            <div class="row"><span class="k">Age (bars)</span><span class="v">${box.age_candles ?? "—"}</span></div>
          </div>
          <div class="card">
            <div class="k">Breakout / Retest</div>
            <div class="v">${fmt(br.price, dig)} / ${rt.detected ? fmt(rt.price, dig) : "—"}</div>
            <div class="row"><span class="k">Retest</span><span class="v">${rt.confirmed ? "Confirmed" : rt.detected ? "Detected" : "Pending"}</span></div>
          </div>

          <div class="card span2">
            <div class="k">Confidence</div>
            <div class="score">${conf}% · ${b.signal_quality || "—"}</div>
            <div class="bar"><i style="width:${Math.min(100, conf)}%"></i></div>
            <div class="row"><span class="k">Liquidity sweep</span><span class="v">${sw.detected ? "✅ " + (sw.direction || "Sweep") : "—"}</span></div>
            <div class="row"><span class="k">FVG / iFVG</span><span class="v">${b.fvg_confirmation ? "✅ Confirmed" : "—"}</span></div>
          </div>

          <div class="card span2">
            <div class="k">Trade plan (advisory)</div>
            <div class="row"><span class="k">Entry</span><span class="v">${fmt(b.entry, dig)}</span></div>
            <div class="row"><span class="k">Stop loss</span><span class="v">${fmt(b.stop_loss, dig)}</span></div>
            <div class="row"><span class="k">TP1 / TP2 / TP3</span><span class="v">${fmt(b.tp1, dig)} · ${fmt(b.tp2, dig)} · ${fmt(b.tp3, dig)}</span></div>
            <div class="row"><span class="k">Risk / reward</span><span class="v">1:${fmt(b.risk_reward, 1)}</span></div>
          </div>

          <div class="card span2">
            <div class="k">Reasons</div>
            <ul class="reasons">${reasons.map((r) => `<li>${r}</li>`).join("") || "<li>Scanning closed bars…</li>"}</ul>
          </div>
        </div>`;
    }

    async function refresh() {
      try {
        const r = await fetch("/api/v1/box-theory/status");
        render(await r.json());
      } catch (e) {
        document.getElementById("main").innerHTML = `<div class="empty">Failed to load: ${e.message}</div>`;
      }
    }
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
