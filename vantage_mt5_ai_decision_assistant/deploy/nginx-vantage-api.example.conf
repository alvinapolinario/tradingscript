# Optional: reverse-proxy the API behind your existing nginx (80/443).
# Place under /etc/nginx/sites-available/ and enable, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# MT5 WebRequest allowlist must match the public URL, e.g.:
#   https://trading.yourdomain.com

server {
    listen 80;
    server_name trading.yourdomain.com;

    # Prefer HTTPS termination (certbot) in production.

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (/ws/monitor)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
